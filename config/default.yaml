# Model Configuration
model:
  num_nodes: 80
  num_features: 80
  hidden_dim: 96
  output_dim: 80
  num_layers: 2
  num_relations: 1
  num_bases: 1
  K: 2
  dropout: 0.0
  
# Temporal Configuration
temporal:
  seq_len: 6
  horizon: 6
  num_weeks: 2
  num_days: 1
  num_hours: 2
  points_per_hour: 6

# Training Configuration
training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0
  max_grad_norm: 5
  scheduler:
    milestones: [60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280]
    gamma: 0.5
    min_lr: 1.0e-12

# Data Configuration
data:
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  normalize: true
  scaler_axis: [0, 1, 2, 3]

# Device Configuration
device: cuda:0

# Paths
paths:
  data_dir: ./data
  checkpoint_dir: ./experiments
  log_dir: ./logs
